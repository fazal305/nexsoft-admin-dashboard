<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive admin dashboard UI built with HTML, CSS, JavaScript, and Chart.js.">

    <title>Nexsoft Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar-overlay" aria-hidden="true"></div>

    <div class="dashboard-layout">
        <aside class="sidebar" aria-label="Dashboard sidebar">
            <div class="sidebar-brand">
                <span>Nexsoft Admin</span>
                <small>Fazal Labs · WorkSuite</small>
            </div>

            <nav class="sidebar-nav" aria-label="Dashboard navigation">
                <a href="#" class="nav-link active" data-title="Dashboard" aria-current="page">
                    <span>📊</span>
                    <span>Dashboard</span>
                </a>

                <a href="#" class="nav-link" data-title="Analytics">
                    <span>📈</span>
                    <span>Analytics</span>
                </a>

                <a href="#" class="nav-link" data-title="Users">
                    <span>👥</span>
                    <span>Users</span>
                </a>

                <a href="#" class="nav-link" data-title="Orders">
                    <span>🛒</span>
                    <span>Orders</span>
                </a>

                <a href="#" class="nav-link" data-title="Settings">
                    <span>⚙️</span>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="navbar-left">
                    <button class="menu-toggle" type="button" aria-label="Open sidebar" aria-expanded="false">
                        ☰
                    </button>

                    <h1 class="page-title">Dashboard</h1>
                </div>

                <div class="navbar-right">
                    <button class="theme-toggle" type="button" aria-label="Switch to light mode">
                        🌙
                    </button>

                    <div class="user-avatar" aria-label="Fazal Abbas profile avatar">
                        FA
                    </div>
                </div>
            </header>

            <section class="dashboard-content" aria-label="Dashboard overview">
                <section class="stats-grid" aria-label="Dashboard statistics">
                    <article class="stat-card">
                        <div class="stat-icon" aria-hidden="true">👥</div>

                        <div class="stat-info">
                            <p class="stat-label">Total Users</p>
                            <h2 class="stat-value">12,480</h2>
                            <p class="stat-trend positive">+12% this month</p>
                        </div>
                    </article>

                    <article class="stat-card">
                        <div class="stat-icon" aria-hidden="true">💰</div>

                        <div class="stat-info">
                            <p class="stat-label">Revenue</p>
                            <h2 class="stat-value">$48,290</h2>
                            <p class="stat-trend positive">+8% this month</p>
                        </div>
                    </article>

                    <article class="stat-card">
                        <div class="stat-icon" aria-hidden="true">🛒</div>

                        <div class="stat-info">
                            <p class="stat-label">Orders</p>
                            <h2 class="stat-value">3,210</h2>
                            <p class="stat-trend negative">-3% this month</p>
                        </div>
                    </article>

                    <article class="stat-card">
                        <div class="stat-icon" aria-hidden="true">📈</div>

                        <div class="stat-info">
                            <p class="stat-label">Conversion Rate</p>
                            <h2 class="stat-value">5.4%</h2>
                            <p class="stat-trend positive">+1.2% this month</p>
                        </div>
                    </article>
                </section>

                <section class="charts-grid" aria-label="Dashboard charts">
                    <article class="chart-card">
                        <h2 class="chart-title">Monthly Revenue</h2>

                        <div class="chart-wrapper">
                            <canvas id="revenueChart" aria-label="Monthly revenue line chart"></canvas>
                        </div>
                    </article>

                    <article class="chart-card">
                        <h2 class="chart-title">Weekly Orders</h2>

                        <div class="chart-wrapper">
                            <canvas id="ordersChart" aria-label="Weekly orders bar chart"></canvas>
                        </div>
                    </article>
                </section>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
